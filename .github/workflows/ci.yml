name: MatrixMarket CI

# Runs on every push and pull request: builds and tests BOTH the Android app and
# the .NET API, and publishes the APKs + test reports as downloadable artifacts.
on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch:

jobs:
  android:
    name: Android - build, unit test, APK
    runs-on: ubuntu-latest
    env:
      MM_HAS_KEYSTORE: ${{ secrets.MM_KEYSTORE_BASE64 != '' }}
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      # Signed release APK - only when the signing secrets have been added to the repo.
      - name: Decode release keystore
        if: env.MM_HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.MM_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/matrixmarket-release.jks"

      - name: Build signed release APK
        if: env.MM_HAS_KEYSTORE == 'true'
        env:
          MM_KEYSTORE_PATH: ${{ runner.temp }}/matrixmarket-release.jks
          MM_KEYSTORE_PASSWORD: ${{ secrets.MM_KEYSTORE_PASSWORD }}
          MM_KEY_ALIAS: ${{ secrets.MM_KEY_ALIAS }}
          MM_KEY_PASSWORD: ${{ secrets.MM_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: matrixmarket-apks
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Upload Android test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-report
          path: android/app/build/reports/tests/
          if-no-files-found: ignore

  backend:
    name: .NET 8 API - build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore MatrixMarket.sln

      - name: Build
        run: dotnet build MatrixMarket.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test MatrixMarket.sln --configuration Release --no-build --logger "trx;LogFileName=results.trx" --results-directory TestResults

      - name: Upload API test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: backend/TestResults/
          if-no-files-found: ignore
